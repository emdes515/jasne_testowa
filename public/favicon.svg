<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Tło Nocturne Luminary -->
  <rect width="32" height="32" rx="7" fill="#0B101B"/>
  
  <!-- Poświata filamentu -->
  <circle cx="16" cy="18" r="5" fill="#FFB800" fill-opacity="0.25"/>

  <!-- 1. Biret akademicki -->
  <polygon points="16,4 6,8.5 16,13 26,8.5" stroke="#DFE2F1" stroke-width="1.2" stroke-linejoin="round" fill="#0B101B"/>
  <path d="M11 10.5 V13.5 C11 15 21 15 21 13.5 V10.5" stroke="#DFE2F1" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Chwost (tassel) -->
  <path d="M23 9.5 V14" stroke="#FFB800" stroke-width="1" stroke-linecap="round"/>
  <circle cx="23" cy="14.5" r="0.8" fill="#FFB800"/>

  <!-- 2. Kontur bańki żarówki -->
  <path d="M11 14.5 C8.5 17.5 8.5 20.5 10.5 23 C11.5 24.5 12.5 25.5 12.5 27 H19.5 C19.5 25.5 20.5 24.5 21.5 23 C23.5 20.5 23.5 17.5 21 14.5" stroke="#DFE2F1" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Gwint żarówki -->
  <path d="M13.5 28.5 H18.5" stroke="#DFE2F1" stroke-width="1" stroke-linecap="round"/>
  <path d="M14.5 30 H17.5" stroke="#DFE2F1" stroke-width="1" stroke-linecap="round"/>

  <!-- 4. Świecący żarnik Amber -->
  <path d="M14.5 23 V19 C14.5 17.5 12.5 17.5 12.5 19 C12.5 21 16 21.5 16 21.5 C16 21.5 19.5 21 19.5 19 C19.5 17.5 17.5 17.5 17.5 19 V23" stroke="#FFB800" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
